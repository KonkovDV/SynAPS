# K2.3: Linux KI-N3 recapture. Reuses the native-accelerator maturin build.
# Does not rewrite hashed dead-zone JSON. Dispatch only.
name: Linux N3 recapture

on:
  workflow_dispatch:
    inputs:
      session_id:
        description: Session directory name under deadzone evidence/sessions/
        required: false
        default: n3-linux-2026-08-27

permissions:
  contents: read

jobs:
  n3-linux:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
          python -m pip install maturin

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable

      - name: Build native accelerator module
        run: |
          mkdir -p native-dist
          python -m maturin build --manifest-path native/synaps_native/Cargo.toml --release --out native-dist
          python -m pip install --force-reinstall native-dist/*.whl

      - name: Verify native backend
        run: |
          python - <<'PY'
          from synaps import accelerators
          status = accelerators.get_acceleration_status()
          print(status)
          assert status["native_available"] is True
          PY

      - name: Recapture six RHC-GREEDY cells seed 1
        run: |
          python -m benchmark.study_deadzone_5k \
            --in-process \
            --session-id "${{ inputs.session_id }}" \
            --seeds 1 \
            --solvers RHC-GREEDY \
            --ops 5000,8000 \
            --machines 4,8,12

      - name: Upload session
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: n3-linux-recapture
          path: benchmark/evidence/deadzone-5k-2026-08-25/sessions/${{ inputs.session_id }}/
          if-no-files-found: error
          retention-days: 30
