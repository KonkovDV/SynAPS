name: Benchmark

on:
  schedule:
    - cron: "0 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: benchmark-${{ github.workflow }}
  cancel-in-progress: false

jobs:
  benchmark:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
          python -m pip install maturin

      - name: Install Rust toolchain
        run: |
          curl https://sh.rustup.rs -sSf | sh -s -- -y --profile minimal --default-toolchain stable
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Build native accelerator module (best effort)
        continue-on-error: true
        run: |
          mkdir -p native-dist
          python -m maturin build --manifest-path native/synaps_native/Cargo.toml --release --out native-dist
          python -m pip install --force-reinstall native-dist/*.whl

      - name: Run benchmark suite
        run: |
          mkdir -p benchmark/results
          python -m benchmark.run_benchmark benchmark/instances/ \
            --solvers GREED CPSAT-10 CPSAT-30 --compare --runs 3 \
            > benchmark/results/weekly-benchmark.json

      - name: Run native acceleration comparison
        run: |
          python -m benchmark.study_native_acceleration \
            --sizes 5000,50000 \
            --repeats 3 \
            --output benchmark/results/native-atcs-acceleration.json

      - name: Upload benchmark results
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: benchmark-results
          path: benchmark/results/
          if-no-files-found: error
          retention-days: 30
