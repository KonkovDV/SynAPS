name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      publish_target:
        description: "Where to publish built distributions"
        required: true
        default: build-only
        type: choice
        options:
          - build-only
          - testpypi
          - pypi

permissions:
  contents: read
  id-token: write
  attestations: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Build distributions
        run: python -m build

      - name: Validate distribution metadata
        run: twine check dist/*

      - name: Generate SBOM from lock file
        run: |
          python -m pip install cyclonedx-bom
          python -m cyclonedx_py requirements requirements-lock.txt -o sbom.json

      - name: Attest SBOM provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: sbom.json

      - name: Upload built distributions
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: python-package-distributions
          path: dist/
          if-no-files-found: error
          retention-days: 30

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom
          path: sbom.json
          if-no-files-found: error
          retention-days: 30

      - name: Attest distribution provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*

  build-native-wheels:
    if: (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) || github.event_name == 'workflow_dispatch'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.12", "3.13"]
        include:
          # ABI tag for /opt/python inside manylinux. Workflow expressions have
          # no replace(), so the compact tag is listed beside the dotted version.
          - os: ubuntu-latest
            python-version: "3.12"
            py_abi: "312"
          - os: ubuntu-latest
            python-version: "3.13"
            py_abi: "313"
          - os: macos-latest
            python-version: "3.12"
            py_abi: "312"
          - os: macos-latest
            python-version: "3.13"
            py_abi: "313"
          - os: windows-latest
            python-version: "3.12"
            py_abi: "312"
          - os: windows-latest
            python-version: "3.13"
            py_abi: "313"
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Set up Rust
        # Linux compiles inside the manylinux image, which installs its own
        # toolchain. The host rustc is unused there.
        if: runner.os != 'Linux'
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable

      - name: Install maturin
        # Linux uses the pinned maturin inside maturin-action. An unpinned
        # `pip install maturin` on that job never builds the wheel.
        if: runner.os != 'Linux'
        run: |
          python -m pip install --upgrade pip
          python -m pip install "maturin==1.13.1"

      - name: Build Linux wheel in manylinux 2.28
        # T-03b: ubuntu-latest links the host glibc (newer than 2.28), so a
        # wheel built there will not install on manylinux_2_28. The action
        # builds inside the 2.28 image. RUSTFLAGS (prefix RUST) is forwarded
        # into that container and still overrides target-cpu=native (R-10).
        # The image digest and rustc 1.99.1 are the ones from run 40355045146.
        # `:latest` and `rust-toolchain: stable` both move. The action's PATH
        # export stops at cp312; the interpreter path is the binary maturin
        # resolved for 3.13 (`/opt/python/cp313-cp313/bin/python`).
        if: runner.os == 'Linux'
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        env:
          RUSTFLAGS: -C target-cpu=x86-64-v2
        with:
          maturin-version: v1.13.1
          manylinux: "2_28"
          container: quay.io/pypa/manylinux_2_28_x86_64@sha256:e0adf18521ad35192df733a6c62d35df7801957d24e0470238aacecfab2188a3
          rust-toolchain: 1.99.1
          args: >-
            --release
            --manifest-path native/synaps_native/Cargo.toml
            --interpreter /opt/python/cp${{ matrix.py_abi }}-cp${{ matrix.py_abi }}/bin/python
            --out dist-native

      - name: Build native wheel
        if: runner.os != 'Linux'
        env:
          # Audit 2026-10 (R-10): the repo's .cargo/config.toml sets
          # target-cpu=native for local builds. A published wheel built with it
          # carries the runner's ISA extensions (e.g. AVX-512) and dies with
          # SIGILL on older CPUs before the Python fallback can engage.
          # RUSTFLAGS takes precedence over config rustflags: pin a portable
          # baseline (x86-64-v2 = SSE4.2/POPCNT; Apple M1 for arm64 runners).
          RUSTFLAGS: ${{ runner.arch == 'ARM64' && '-C target-cpu=apple-m1' || '-C target-cpu=x86-64-v2' }}
        # R-11: backslash continuations are bash syntax; windows-latest
        # defaults to PowerShell.
        shell: bash
        run: |
          python -m maturin build \
            --manifest-path native/synaps_native/Cargo.toml \
            --release \
            --interpreter python \
            --out dist-native

      - name: Verify portable ISA (no AVX; imports without AVX2)
        # T-03a: prove R-10 on the built artifact instead of trusting RUSTFLAGS.
        # Static: no VEX/EVEX instruction (ymm, zmm or VEX-128) in the .so.
        # Dynamic: import + scalar and batch kernels under qemu user-mode
        # emulation of a Nehalem CPU (SSE4.2, no AVX). A target-cpu=native
        # wheel fails both (SIGILL under emulation).
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q qemu-user
          python -m venv .venv-isa
          .venv-isa/bin/python -m pip install --no-deps dist-native/*.whl
          python scripts/check_wheel_isa.py dist-native/*.whl --qemu-python .venv-isa/bin/python

      - name: Upload native wheels
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native-wheel-${{ matrix.os }}-py${{ matrix.python-version }}
          path: dist-native/*.whl
          if-no-files-found: error
          retention-days: 30

      - name: Attest native wheel provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist-native/*.whl

  publish-testpypi:
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.publish_target == 'testpypi'
    needs: [build, build-native-wheels]
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/p/synaps
    permissions:
      id-token: write

    steps:
      - name: Download distributions
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: python-package-distributions
          path: dist/

      - name: Download native wheels
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: native-wheel-*
          merge-multiple: true
          path: dist-native/

      - name: Publish to TestPyPI
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          repository-url: https://test.pypi.org/legacy/
          print-hash: true

      - name: Publish native wheels to TestPyPI
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          repository-url: https://test.pypi.org/legacy/
          packages-dir: dist-native/
          skip-existing: true
          print-hash: true

  publish-pypi:
    if: (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) || (github.event_name == 'workflow_dispatch' && github.event.inputs.publish_target == 'pypi')
    needs: [build, build-native-wheels]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/synaps
    permissions:
      id-token: write

    steps:
      - name: Download distributions
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: python-package-distributions
          path: dist/

      - name: Download native wheels
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: native-wheel-*
          merge-multiple: true
          path: dist-native/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          print-hash: true

      - name: Publish native wheels to PyPI
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          packages-dir: dist-native/
          skip-existing: true
          print-hash: true