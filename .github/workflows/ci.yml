name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Lint
        run: ruff check synaps tests benchmark

      - name: Lint (format check)
        run: ruff format --check synaps tests benchmark

      - name: Claims lint
        run: python scripts/verify_claims.py

  contract-schema-drift:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Regenerate contract schemas
        run: python -m synaps write-contract-schemas --output-dir schema/contracts

      - name: Ensure contract schemas are up to date
        run: git diff --exit-code -- schema/contracts

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Type check
        run: mypy synaps --strict --no-error-summary

  test-fast:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Run fast tests
        run: |
          pytest tests/ -v --tb=short -m "not slow" \
            --cov=synaps --cov-report=term-missing \
            --cov-fail-under=65

      - name: Upload coverage artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-${{ matrix.python-version }}
          path: .coverage
          retention-days: 1

  benchmark-smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements-lock.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # Prefer the lock so highspy (and peers) match the audited ABI set.
          python -m pip install -r requirements-lock.txt
          python -m pip install -e ".[dev]"

      - name: Run benchmark smoke (tiny instance)
        run: |
          python -m benchmark.run_benchmark benchmark/instances/tiny_3x3.json --solvers GREED CPSAT-30 --compare

  test-slow:
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Run slow tests
        run: pytest tests/ -v --tb=short -m "slow"

  control-plane:
    runs-on: ubuntu-latest
    env:
      SYNAPS_PYTHON_BIN: python
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install SynAPS Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Set up Node.js
        uses: actions/setup-node@395ad3262231945c25e8478fd5baf05154b1d79f # v6.1.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: control-plane/package-lock.json

      - name: Install control-plane dependencies
        working-directory: control-plane
        run: npm ci

      - name: Build control-plane
        working-directory: control-plane
        run: npm run build

      - name: Test control-plane
        working-directory: control-plane
        run: npm test

  native-accelerator:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
          python -m pip install maturin

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable

      - name: Build native accelerator module
        run: |
          mkdir -p native-dist
          python -m maturin build --manifest-path native/synaps_native/Cargo.toml --release --out native-dist
          python -m pip install --force-reinstall native-dist/*.whl

      - name: Verify active native backend
        run: |
          python - <<'PY'
          from synaps import accelerators
          status = accelerators.get_acceleration_status()
          print(status)
          assert status["native_available"] is True
          assert status["atcs_log_score_batch_backend"] == "native"
          assert status["rhc_candidate_metrics_backend"] == "native"
          PY

      - name: Run accelerator-focused tests
        run: |
          pytest -q tests/test_accelerators.py tests/test_greedy_dispatch.py

      - name: Run native acceleration microbenchmark
        run: |
          python -m benchmark.study_native_acceleration \
            --sizes 5000,50000 \
            --repeats 3 \
            --output benchmark/results/ci-native-atcs-acceleration.json

      - name: COVER ladder cell on Linux (60k@100 seed 1)
        timeout-minutes: 15
        run: |
          python -m benchmark.study_cover_ladder \
            --out-dir benchmark/results/ci-cover-linux \
            --scales 60k@100 \
            --seeds 1 \
            --ci-gate \
            --max-wall-s 180

      - name: COVER ladder cell on Linux (100k@200 seed 42)
        timeout-minutes: 20
        run: |
          python -m benchmark.study_cover_ladder \
            --out-dir benchmark/results/ci-cover-linux-100k \
            --scales 100k@200 \
            --seeds 42 \
            --ci-gate \
            --max-wall-s 180

      - name: Native list-schedule calendar occupancy
        run: |
          pytest -q tests/test_accelerators.py::test_native_list_schedule_cover_clips_setup_into_open_shift \
            tests/test_calendar.py::test_list_schedule_cover_clips_setup_into_open_shift

      - name: Calendar 3000 seed 1 on Linux
        timeout-minutes: 15
        run: |
          python -m benchmark.study_calendar_3000 \
            --out-dir benchmark/results/ci-calendar-3000 \
            --seeds 1

      - name: BEAM timebox on Linux
        run: |
          pytest -q tests/test_timebox_enforcement.py::test_beam_honors_shared_deadline \
            tests/test_timebox_enforcement.py::test_beam_stops_when_slot_search_is_slow

      - name: Upload native acceleration artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: native-acceleration-results
          path: benchmark/results/ci-native-atcs-acceleration.json
          if-no-files-found: error
          retention-days: 14

  build-distributions:
    runs-on: ubuntu-latest
    needs: [lint, contract-schema-drift, typecheck, test-fast, benchmark-smoke, control-plane]
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Build distributions
        run: python -m build

      - name: Validate distribution metadata
        run: twine check dist/*

      - name: Verify lock files are up to date
        run: |
          python -m pip install "uv==0.12.5"
          python -m uv pip compile pyproject.toml --output-file requirements-lock.txt --no-annotate --quiet
          git diff --exit-code -- requirements-lock.txt || (echo "Lock file out of date. Run: uv pip compile pyproject.toml --output-file requirements-lock.txt"; exit 1)

      - name: Upload built distributions
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: python-package-distributions
          path: dist/
          if-no-files-found: error
          retention-days: 14

  installed-wheel-smoke:
    runs-on: ubuntu-latest
    needs: build-distributions
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.13"

      - name: Download built distributions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: python-package-distributions
          path: dist/

      - name: Install wheel into fresh venv
        run: |
          python -m venv /tmp/synaps-smoke-venv
          /tmp/synaps-smoke-venv/bin/python -m pip install --upgrade pip
          /tmp/synaps-smoke-venv/bin/python -m pip install dist/*.whl

      - name: Verify package import and CLI
        run: |
          /tmp/synaps-smoke-venv/bin/python -c "import synaps; print(synaps.__version__)"
          /tmp/synaps-smoke-venv/bin/python -m synaps list-solver-configs

      - name: Run smoke tests against installed wheel
        run: |
          /tmp/synaps-smoke-venv/bin/python -m pip install pytest
          /tmp/synaps-smoke-venv/bin/python -m pytest tests/smoke -q
