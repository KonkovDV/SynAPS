# LOCAL builds only. `target-cpu=native` follows the host and SIGILLs on
# another CPU (audit 2026-10, R-10). Run `cargo clean` after moving hosts.
# Release wheels override this via RUSTFLAGS (x86-64-v2 / apple-m1).
[target.'cfg(target_arch = "x86_64")']
rustflags = ["-C", "target-cpu=native"]

# Prefer self-contained LLD on Windows GNU to avoid MinGW ld.exe failures
# on non-ASCII user profile paths (for example Cyrillic usernames).
[target.x86_64-pc-windows-gnu]
linker = "rust-lld"
rustflags = ["-C", "target-cpu=native", "-C", "link-self-contained=yes"]